  html, body { margin: 0; background: #FFFFFF; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  body { font-family: "Transit Sans", Arial, sans-serif; color: #111; }
  #stage { display: block; width: 1200px; height: 900px; }
  #controls { width: 1200px; box-sizing: border-box; padding: 10px 24px 8px; display: flex; gap: 14px; align-items: center; font-size: 13px; }
  #controls button { font: inherit; padding: 6px 14px; border: 2px solid #111; background: #fff; border-radius: 18px; cursor: pointer; min-width: 76px; font-weight: 700; }
  #controls input[type=range] { flex: 1; accent-color: #111; }
  #controls .t { font-variant-numeric: tabular-nums; min-width: 190px; text-align: right; color: #555; }
  #hops { width: 1200px; box-sizing: border-box; padding: 4px 24px 24px; font-size: 13px; }
  #hops table { border-collapse: collapse; width: 100%; }
  #hops td, #hops th { text-align: left; padding: 3px 8px; border-bottom: 1px solid #eee; }
  #hops td:first-child { white-space: nowrap; }   /* start times like "1.5 ms" never wrap (narrow windows, long service names) */
  #wrap { display: flex; align-items: flex-start; }
  #main { width: 1200px; flex: none; }
  #panel { width: 400px; flex: none; box-sizing: border-box; border-left: 2px solid #111; font-size: 13px; }
  /* interactive layout: page never scrolls; map scales to fit above a reserved 180px list area; hop table and panel body scroll on their own. #main needs an explicit height because #wrap uses align-items: flex-start (render mode), otherwise the list grows instead of scrolling. */
  html:not(.render), html:not(.render) body { height: 100%; overflow: hidden; }
  html:not(.render) #wrap { display: flex; height: 100vh; }
  /* the map keeps its 4:3 aspect inside the height left above the list, so #main takes exactly the map's width and the panel takes the rest: header, map, controls and hop list share one right edge and there is no blank strip before the panel */
  html:not(.render) #main { flex: none; width: min(calc(100vw - 400px), calc((100vh - 56px - 180px) * 4 / 3)); min-width: 0; height: 100vh; min-height: 0; align-self: stretch; display: flex; flex-direction: column; overflow: hidden; }
  html:not(.render) #stage { flex: none; width: 100%; height: auto; aspect-ratio: 1200 / 900; }
  html:not(.render) #panel { flex: 1; width: auto; min-width: 400px; }
  #panel .pbody { container-type: inline-size; }
  html:not(.render) #controls { width: 100%; flex: none; }
  html:not(.render) #hops { width: 100%; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; }
  #panel { display: flex; flex-direction: column; overflow: hidden; height: 100vh; }
  #panel .pbody { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: 0 18px 24px; scrollbar-width: thin; scrollbar-color: #9A9A9A transparent; outline: none; }
  #panel .pbody::-webkit-scrollbar { width: 8px; } #panel .pbody::-webkit-scrollbar-thumb { background: #C4C4C4; border-radius: 4px; } #panel .pbody::-webkit-scrollbar-track { background: transparent; }
  #panel .sign { flex: none; position: sticky; top: 0; z-index: 1; }
  #panel .sign .sub .bul { vertical-align: -2px; margin: 0 2px; }
  #panel .trow { margin: 8px 0 0; } #panel .trow .tl { font-size: 10px; letter-spacing: .06em; text-transform: uppercase; color: #4A4A4A; } #panel .trow .stats { margin: 3px 0 0; }
  #panel .crumbs .sd.sq { border-radius: 3px; }
  #panel details.client-attrs > summary { font-size: 11px; font-weight: 700; color: #4A4A4A; margin: 4px 0; }

  #panel .sign { background: #111; color: #fff; margin: 0 0 12px; padding: 12px 18px 10px; }
  #panel .sign .st { display: flex; align-items: center; gap: 10px; }
  #panel .sign .sn { font-weight: 700; font-size: 22px; flex: 1; word-break: break-word; }
  #panel .sign::after { content: ""; display: block; width: 40px; height: 4px; background: #fff; margin-top: 8px; }
  #panel .sign .sub { font-size: 11px; letter-spacing: .06em; color: #CFCFCF; margin-top: 6px; text-transform: uppercase; }
  #panel .sign button { background: none; border: 0; color: #fff; font-size: 22px; cursor: pointer; }
  #panel .bul { display: inline-flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 700; flex: none; }
  #panel .bul.sq { border-radius: 4px; }
  #panel h2 { font-size: 16px; margin: 4px 0 10px; word-break: break-word; }
  #panel h3 { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: #4A4A4A; margin: 18px 0 6px; }
  #panel ul { margin: 0; padding: 0; list-style: none; }
  #panel a { color: #111; text-decoration: none; display: block; padding: 3px 0; }
  #panel a:hover { text-decoration: underline; }
  #panel .dot { display: inline-block; width: 10px; height: 10px; border-radius: 5px; margin-right: 6px; }
  #panel .muted { color: #9A9A9A; margin: 4px 0; }
  #panel .mono, #panel code, #panel .src { font-family: ui-monospace, monospace; font-size: 11px; }
  #panel .tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 8px; background: #E7E7E7; }
  #panel .tag.err { background: #D42A1E; color: #fff; } #panel .tag.slow { background: #E89A00; } #panel .tag.ok { background: #111; color: #fff; }
  #panel .crumbs { display: flex; align-items: flex-start; margin: 6px 0 12px; overflow-x: auto; }
  #panel .crumbs .stop { display: flex; flex-direction: column; align-items: center; padding: 0; min-width: 0; flex: none; max-width: 72px; }
  #panel .crumbs .sd { width: 10px; height: 10px; border: 3px solid; border-radius: 50%; background: #fff; }
  #panel .crumbs .sl { font-size: 10px; color: #4A4A4A; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 72px; }
  #panel .crumbs .here .sl { color: #111; font-weight: 700; }
  #panel .crumbs .seg { flex: 1; min-width: 8px; height: 3px; background: #D0D0D0; margin-top: 7px; }
  #panel .wf { position: relative; height: 16px; margin: 4px 0 2px; }
  #panel .wf-parent { position: absolute; inset: 6px 0; background: #E7E7E7; border-radius: 2px; }
  #panel .wf-span { position: absolute; top: 0; height: 16px; min-width: 2px; border-radius: 3px; overflow: hidden; }
  #panel .wf-span i { position: absolute; top: 0; bottom: 0; background: rgba(255,255,255,.6); }
  #panel .wf-cap { display: flex; flex-direction: column; gap: 1px; font-size: 11px; color: #4A4A4A; }
  #panel .stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; margin: 10px 0 6px; }
  @container (min-width: 560px) { #panel .stats { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  #panel .stat { background: #F4F4F4; padding: 5px 8px; border-radius: 4px; min-width: 0; }
  #panel .stat b { display: block; overflow-wrap: anywhere; }
  #panel .stat span { display: block; font-size: 10px; color: #4A4A4A; text-transform: uppercase; letter-spacing: .05em; }
  #panel .stat b { font-size: 12px; }
  #panel .status { margin: 4px 0; color: #4A4A4A; } #panel .status.err { color: #D42A1E; }
  #panel .match { margin: 0 0 8px; }
  #panel .card { border: 2px solid #111; border-radius: 6px; margin: 0 0 10px; overflow: hidden; }
  #panel .card.gap { border-style: dashed; border-color: #9A9A9A; color: #4A4A4A; }
  #panel .card.infra { border-style: dotted; border-color: #8C8C8C; }
  #panel .card .ch { display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-bottom: 1px solid #E7E7E7; }
  #panel .card .ch b { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  #panel .card .cn { font-family: ui-monospace, monospace; font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #panel .card .conf { font-size: 11px; color: #4A4A4A; display: flex; align-items: center; gap: 4px; }
  #panel .card .conf i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  #panel .card .badges { padding: 6px 10px 0; display: flex; gap: 6px; flex-wrap: wrap; }
  #panel .badge { font-size: 10px; padding: 1px 6px; border-radius: 8px; border: 1px solid #111; }
  #panel .badge.v { background: #111; color: #fff; } #panel .badge.t { background: #fff; } #panel .badge.o { border-color: #CFCFCF; color: #4A4A4A; }
  #panel .card .cb { padding: 6px 10px 8px; }
  #panel .card .f { display: flex; gap: 6px; align-items: baseline; padding: 1px 0; font-size: 12px; }
  #panel .card .req { width: 10px; font-size: 9px; color: #111; flex: none; }
  #panel .card .fn { font-family: ui-monospace, monospace; }
  #panel .card .ft { color: #2A62C9; font-family: ui-monospace, monospace; font-size: 11px; }
  #panel .card .fc { color: #9A9A9A; font-size: 10px; }
  #panel .card .src, #panel .match .src { padding: 0 10px 6px; color: #4A4A4A; }
  #panel .match .src { padding: 2px 0 0; }
